<?xml version="1.0" encoding="UTF-8"?>
<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background: Midnight Royal Indigo Sanctuary -->
    <linearGradient id="rbBg" x1="0" y1="0" x2="1024" y2="1024" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="50%" stop-color="#090D1E"/>
      <stop offset="100%" stop-color="#04060E"/>
    </linearGradient>

    <!-- Celestial Indigo Radial Glow -->
    <radialGradient id="rbGlow" cx="512" cy="480" r="620" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#4F46E5" stop-opacity="0.44"/>
      <stop offset="35%" stop-color="#3730A3" stop-opacity="0.20"/>
      <stop offset="70%" stop-color="#1E1B4B" stop-opacity="0.04"/>
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0"/>
    </radialGradient>

    <!-- Edge Vignette -->
    <radialGradient id="rbVignette" cx="512" cy="512" r="720" gradientUnits="userSpaceOnUse">
      <stop offset="55%" stop-color="#000000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.55"/>
    </radialGradient>

    <!-- Stately Leather Indigo Tome Gradient -->
    <linearGradient id="rbCover" x1="200" y1="200" x2="800" y2="800" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#6366F1"/>
      <stop offset="25%" stop-color="#4F46E5"/>
      <stop offset="65%" stop-color="#3730A3"/>
      <stop offset="100%" stop-color="#1E1B4B"/>
    </linearGradient>

    <!-- Spine Leather Gradient -->
    <linearGradient id="rbSpine" x1="230" y1="240" x2="310" y2="780" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#3730A3"/>
      <stop offset="50%" stop-color="#312E81"/>
      <stop offset="100%" stop-color="#1E1B4B"/>
    </linearGradient>

    <!-- 24K Juridical Gold Gradient -->
    <linearGradient id="rbGold" x1="300" y1="200" x2="724" y2="800" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFBEB"/>
      <stop offset="20%" stop-color="#FEF08A"/>
      <stop offset="50%" stop-color="#F59E0B"/>
      <stop offset="85%" stop-color="#D97706"/>
      <stop offset="100%" stop-color="#92400E"/>
    </linearGradient>

    <!-- Gilded Book Pages Gradient -->
    <linearGradient id="rbPages" x1="200" y1="740" x2="800" y2="780" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FEF3C7"/>
      <stop offset="40%" stop-color="#FDE68A"/>
      <stop offset="70%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>

    <!-- Royal Crimson Bookmark Ribbon -->
    <linearGradient id="rbRibbon" x1="710" y1="180" x2="760" y2="840" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FDA4AF"/>
      <stop offset="25%" stop-color="#F43F5E"/>
      <stop offset="60%" stop-color="#E11D48"/>
      <stop offset="100%" stop-color="#9F1239"/>
    </linearGradient>

    <!-- Drop Shadows -->
    <filter id="rbShadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="28" stdDeviation="32" flood-color="#000000" flood-opacity="0.80"/>
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#312E81" flood-opacity="0.45"/>
    </filter>

    <filter id="goldEmboss" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#000000" flood-opacity="0.65"/>
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#FEF08A" flood-opacity="0.30"/>
    </filter>

    <!-- Top Gloss Sheen -->
    <linearGradient id="rbSheen" x1="0" y1="0" x2="0" y2="340" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Base Canvas -->
  <rect width="1024" height="1024" fill="url(#rbBg)"/>
  <rect width="1024" height="1024" fill="url(#rbGlow)"/>
  <rect width="1024" height="1024" fill="url(#rbVignette)"/>

  <!-- Background Authority Star Constellation / Decorative Ring -->
  <g opacity="0.30">
    <circle cx="512" cy="512" r="380" fill="none" stroke="#4F46E5" stroke-width="3" stroke-dasharray="16 16"/>
    <circle cx="512" cy="512" r="340" fill="none" stroke="#F59E0B" stroke-width="2" stroke-dasharray="8 24" opacity="0.6"/>
  </g>

  <!-- ==================== ROYAL CODEX / LAW RULEBOOK ==================== -->
  <g filter="url(#rbShadow)">
    <!-- Book Drop Page Edge Block (Gilded Stack of Pages at Bottom and Right) -->
    <path d="M 280 756 L 750 756 C 770 756, 784 742, 784 722 L 784 290 L 804 300 L 804 740 C 804 766, 784 786, 758 786 L 298 786 Z" fill="url(#rbPages)"/>
    <line x1="310" y1="766" x2="780" y2="766" stroke="#92400E" stroke-width="2" opacity="0.5"/>
    <line x1="310" y1="776" x2="774" y2="776" stroke="#92400E" stroke-width="2" opacity="0.5"/>

    <!-- Main Front Cover -->
    <rect x="250" y="234" width="516" height="526" rx="28" fill="url(#rbCover)" stroke="#818CF8" stroke-width="4"/>

    <!-- Book Spine Rib (Left side) -->
    <path d="M 250 262 C 250 246, 264 234, 280 234 L 320 234 L 320 760 L 280 760 C 264 760, 250 748, 250 732 Z" fill="url(#rbSpine)"/>
    <line x1="320" y1="234" x2="320" y2="760" stroke="#1E1B4B" stroke-width="6"/>
    <line x1="322" y1="234" x2="322" y2="760" stroke="#818CF8" stroke-width="2" opacity="0.6"/>

    <!-- Decorative Gold Spine Bands -->
    <rect x="250" y="320" width="70" height="12" fill="url(#rbGold)"/>
    <rect x="250" y="440" width="70" height="12" fill="url(#rbGold)"/>
    <rect x="250" y="560" width="70" height="12" fill="url(#rbGold)"/>
    <rect x="250" y="680" width="70" height="12" fill="url(#rbGold)"/>

    <!-- Gold Filigree Corner Ornaments on Cover -->
    <g stroke="url(#rbGold)" stroke-width="3" fill="none">
      <path d="M 720 264 L 736 264 L 736 280"/>
      <circle cx="724" cy="276" r="4" fill="url(#rbGold)"/>
      <path d="M 720 730 L 736 730 L 736 714"/>
      <circle cx="724" cy="718" r="4" fill="url(#rbGold)"/>
    </g>

    <!-- Outer Gold Cover Border Fillet -->
    <rect x="346" y="260" width="394" height="474" rx="16" fill="none" stroke="url(#rbGold)" stroke-width="3.5" opacity="0.85"/>
    <rect x="356" y="270" width="374" height="454" rx="12" fill="none" stroke="url(#rbGold)" stroke-width="1.5" stroke-dasharray="8 6" opacity="0.65"/>

    <!-- Royal Crimson Bookmark Ribbon (Positioned on the RIGHT edge so it does NOT block the center scale!) -->
    <path d="M 696 210 L 734 210 L 734 796 L 715 770 L 696 796 Z" fill="url(#rbRibbon)" filter="url(#goldEmboss)"/>
    <line x1="715" y1="210" x2="715" y2="770" stroke="#FDA4AF" stroke-width="2" opacity="0.6"/>

    <!-- ==================== CENTRAL LAW EMBLEM: SCALES OF JUSTICE ==================== -->
    <g filter="url(#goldEmboss)">
      <!-- Central Pillar of Justice -->
      <line x1="532" y1="360" x2="532" y2="600" stroke="url(#rbGold)" stroke-width="14" stroke-linecap="round"/>
      <!-- Pillar Finial (Top Imperial Spear / Diamond) -->
      <polygon points="532,328 546,358 532,366 518,358" fill="url(#rbGold)"/>

      <!-- Scales Balance Beam (Horizontal Bar with Pivot) -->
      <path d="M 390 412 Q 532 396 674 412" fill="none" stroke="url(#rbGold)" stroke-width="12" stroke-linecap="round"/>
      
      <!-- Center Pivot Ring & Core Gem -->
      <circle cx="532" cy="404" r="20" fill="url(#rbCover)" stroke="url(#rbGold)" stroke-width="5"/>
      <circle cx="532" cy="404" r="10" fill="url(#rbGold)"/>

      <!-- Left Scale Pan & Cords -->
      <g id="leftScale">
        <line x1="390" y1="412" x2="354" y2="494" stroke="url(#rbGold)" stroke-width="4"/>
        <line x1="390" y1="412" x2="426" y2="494" stroke="url(#rbGold)" stroke-width="4"/>
        <!-- Scale Bowl (Deep 3D Metallic Dish) -->
        <path d="M 340 494 Q 390 538 440 494 Z" fill="url(#rbGold)" stroke="#FFFBEB" stroke-width="2"/>
        <ellipse cx="390" cy="494" rx="50" ry="8" fill="url(#rbGold)"/>
      </g>

      <!-- Right Scale Pan & Cords -->
      <g id="rightScale">
        <line x1="674" y1="412" x2="638" y2="494" stroke="url(#rbGold)" stroke-width="4"/>
        <line x1="674" y1="412" x2="710" y2="494" stroke="url(#rbGold)" stroke-width="4"/>
        <!-- Scale Bowl (Deep 3D Metallic Dish) -->
        <path d="M 624 494 Q 674 538 724 494 Z" fill="url(#rbGold)" stroke="#FFFBEB" stroke-width="2"/>
        <ellipse cx="674" cy="494" rx="50" ry="8" fill="url(#rbGold)"/>
      </g>

      <!-- Pedestal / 3-Tier Foundation Base of Justice -->
      <rect x="472" y="600" width="120" height="18" rx="8" fill="url(#rbGold)"/>
      <rect x="452" y="618" width="160" height="22" rx="9" fill="url(#rbGold)"/>
      <rect x="432" y="640" width="200" height="26" rx="10" fill="url(#rbGold)"/>

      <!-- Star / Sunburst of Authority at base -->
      <circle cx="532" cy="653" r="6" fill="#FFFFFF"/>
    </g>
  </g>

  <!-- Top Gloss Sheen -->
  <rect width="1024" height="340" fill="url(#rbSheen)"/>
</svg>
